name: Live Pages verification
on:
  push:
    branches: [main]
    paths:
      - 'scripts/check_live.py'
      - '.github/workflows/live-check.yml'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Expected site mode
        type: choice
        options: [preview, indexed]
        default: indexed
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify HTTPS pages and security
        env:
          EXPECTED_MODE: ${{ inputs.mode || 'indexed' }}
        run: |
          python3 -m py_compile scripts/check_live.py
          for attempt in 1 2 3 4 5; do
            if python3 scripts/check_live.py --mode "$EXPECTED_MODE"; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then sleep 15; fi
          done
          exit 1

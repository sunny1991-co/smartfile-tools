name: Browser regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/build.cjs
      - run: node --check site/assets/tools.js
      - run: node --check site/assets/photo-studio.js
      - run: node --check site/assets/background.js && node --check site/assets/background-worker.js
      - run: node tests/static.cjs
      - run: node tests/launch.cjs
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/smoke.py
      - run: python tests/performance.py

      - run: npm audit --omit=dev --audit-level=moderate
      - run: python scripts/package_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: smartfile-mobile-preview
          path: preview-output/
          if-no-files-found: error
          retention-days: 7

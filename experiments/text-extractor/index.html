<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SmartFile Text Extractor — test</title><link rel="stylesheet" href="style.css"></head><body><main><p class="note">प्रयोगात्मक संस्करण · Production से अलग</p><h1>Smart Text Extractor</h1><p>PDF, Gallery की फोटो या Camera से टेक्स्ट निकालें। OCR के परिणाम जांचें।</p><form id="form"><label>Gallery / PDF / Files<input id="file" type="file" accept="application/pdf,image/jpeg,image/png,image/webp,.pdf"></label><label>Camera से फोटो<input id="camera" type="file" accept="image/*" capture="environment"></label><label>भाषा / Language<select id="lang"><option value="hin+eng">हिंदी + English</option><option value="hin">हिंदी</option><option value="eng">English</option></select></label><label class="check"><input type="checkbox" id="force">PDF में भी OCR चलाएं (धीमा)</label><button id="start" type="submit">टेक्स्ट निकालें</button><button id="cancel" type="button" hidden>रोकें / Cancel</button></form><p id="status" role="status" aria-live="polite"></p><label>निकाला गया टेक्स्ट / Extracted text<textarea id="text" rows="12" spellcheck="false"></textarea></label><button id="copy" disabled>Copy</button><button id="download" disabled>Download TXT</button><p>सीमा: 20 MB, 5 PDF पेज, 24 MP फोटो; OCR प्रीव्यू अधिकतम 2400 पिक्सेल लंबा किनारा। हस्तलेखन और पुराने फॉन्ट की गारंटी नहीं।</p></main><script type="module" src="extract.mjs"></script></body></html>
